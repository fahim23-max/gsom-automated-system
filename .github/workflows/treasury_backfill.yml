name: Run Monthly Treasury Backfill

on:
  workflow_dispatch: # Allows manual trigger with one click from GitHub Actions

jobs:
  treasury_backfill:
    runs-on: ubuntu-latest
    
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 sqlalchemy psycopg2-binary
          
      - name: Run Monthly Treasury Scraper
        run: python treasury_scraper.py
