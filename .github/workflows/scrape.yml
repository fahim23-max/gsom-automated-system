name: GSOM Daily Scraper

on:
  schedule:
    # 04:10 UTC = 10:10 AM BST (UTC+6), Sunday to Thursday
    - cron: '10 4 * * 0-4'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
          
      - name: Run T-Bill Scraper
        run: python scraper_bills.py
        
      - name: Run Bond & FRTB Scraper
        run: python scraper.py  # Replace with your actual bond script file name if different
