name: Scrape GSOM Data

on:
  schedule:
    # 10:15 AM BST (UTC+6) is 04:15 AM UTC
    - cron: '15 4 * * *'
  workflow_dispatch: # Allows manual run anytime

jobs:
  scrape:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Install Playwright browser (required for Treasury scraper)
        run: playwright install --with-deps chromium

      - name: Run Bond & FRTB Scraper
        run: python scraper.py

      - name: Run T-Bill Scraper
        run: python scraper_bills.py

      - name: Run Treasury Monthly Scraper (current + previous month)
        run: python scraper_treasury_daily.py

      - name: Upload Treasury debug snapshot (only on failure/empty)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: treasury-daily-debug
          path: debug_output/
          if-no-files-found: ignore
