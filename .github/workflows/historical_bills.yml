name: Run Historical T-Bills Backfill

on:
  workflow_dispatch: # Allows manual trigger anytime with one click

jobs:
  backfill:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Historical T-Bills Scraper
        run: python scraper_bills_historical.py
