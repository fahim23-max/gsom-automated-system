name: Run Historical T-Bills Backfill

on:
  workflow_dispatch: # Allows you to trigger it manually anytime with a click

jobs:
  backfill:
    runs-on: ubuntu-latest
    
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
          
      - name: Run Historical T-Bills Scraper
        run: python scraper_bills_historical.py
