name: Run Historical Bonds & FRTBs Backfill

on:
  workflow_dispatch: # Allows manual trigger with one click

jobs:
  backfill:
    runs-on: ubuntu-latest
    
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies & Playwright system libraries
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
          
      - name: Run Historical Bonds Scraper
        run: python backfill_bonds.py
